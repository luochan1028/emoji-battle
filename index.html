<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Emoji大作战</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;flex-direction:column;align-items:center;justify-content:center}

#game{width:100%;max-width:420px;height:100vh;max-height:900px;position:relative;display:flex;flex-direction:column;align-items:center}

#title{color:#fff;text-align:center;margin-top:30px;flex-shrink:0}
#title h1{font-size:30px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.3);letter-spacing:2px}
#title p{font-size:13px;opacity:.8;margin-top:4px}

#info-bar{display:flex;justify-content:space-between;width:90%;margin-top:16px;flex-shrink:0}
.info-box{background:rgba(255,255,255,.15);border-radius:12px;padding:8px 20px;text-align:center;backdrop-filter:blur(4px);min-width:80px}
.info-label{font-size:11px;color:rgba(255,255,255,.7);text-transform:uppercase;letter-spacing:1px}
.info-value{font-size:24px;font-weight:800;color:#fff;line-height:1.2}
#score-value{color:#FFD93D}
#timer-value{color:#FF6B6B}

#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:90%;margin-top:16px;aspect-ratio:1/1;flex-shrink:0}
.cell{background:rgba(255,255,255,.1);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:48px;cursor:pointer;position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.08);transition:transform .1s}
.cell:active{transform:scale(.93)}
.cell.active{background:rgba(255,255,255,.25);border-color:rgba(255,255,255,.4)}
.cell .emoji{opacity:0;transform:scale(.3) rotate(-20deg);transition:all .15s ease-out}
.cell.active .emoji{opacity:1;transform:scale(1) rotate(0deg)}
.cell.hit .emoji{opacity:0;transform:scale(1.8) rotate(30deg);transition:all .12s ease-out}

.particle{position:absolute;font-size:20px;pointer-events:none;animation:particleFly .5s ease-out forwards}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.5)}}

.score-pop{position:absolute;font-size:18px;font-weight:800;color:#FFD93D;pointer-events:none;animation:scorePop .6s ease-out forwards;z-index:10;text-shadow:0 2px 4px rgba(0,0,0,.4)}
@keyframes scorePop{0%{opacity:1;transform:translate(-50%,0) scale(.8)}50%{transform:translate(-50%,-40px) scale(1.2)}100%{opacity:0;transform:translate(-50%,-70px) scale(.8)}}

.overlay{position:absolute;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity .3s;overflow-y:auto;padding:20px 0}
.overlay.hidden{opacity:0;pointer-events:none}
.overlay h2{color:#fff;font-size:26px;font-weight:800;margin-bottom:8px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
.overlay .subtitle{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:24px}
.btn{background:linear-gradient(135deg,#FFD93D,#FF6B6B);color:#fff;border:none;border-radius:30px;padding:14px 44px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(255,107,107,.4);transition:all .2s;letter-spacing:1px}
.btn:active{transform:scale(.95);box-shadow:0 2px 8px rgba(255,107,107,.4)}
.btn-secondary{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);box-shadow:none;font-size:15px;padding:12px 36px}
.btn-secondary:active{transform:scale(.95)}
.btn-row{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center}

#result{display:none;flex-direction:column;align-items:center}
#result .rating{font-size:64px;margin:16px 0}
#result .final-score{font-size:48px;font-weight:800;color:#FFD93D;text-shadow:0 2px 8px rgba(0,0,0,.3)}
#result .score-label{color:rgba(255,255,255,.6);font-size:13px;margin-top:4px}
#result .best-score{color:rgba(255,255,255,.5);font-size:14px;margin:8px 0 16px}
#result .comment{color:rgba(255,255,255,.8);font-size:15px;margin-bottom:16px;text-align:center;max-width:280px;line-height:1.6}

.deco{position:absolute;pointer-events:none;opacity:.06;color:#fff}
.deco1{font-size:120px;top:5%;right:-20px;transform:rotate(15deg)}
.deco2{font-size:80px;bottom:10%;left:-15px;transform:rotate(-10deg)}

/* 排行榜 */
#rank-list{width:90%;max-width:380px;margin-top:16px}
.rank-item{display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(255,255,255,.08);border-radius:12px;margin-bottom:8px;transition:all .2s}
.rank-item.me{background:rgba(255,217,61,.15);border:1px solid rgba(255,217,61,.3)}
.rank-pos{font-size:20px;font-weight:800;color:rgba(255,255,255,.5);min-width:32px;text-align:center}
.rank-pos.gold{color:#FFD700}
.rank-pos.silver{color:#C0C0C0}
.rank-pos.bronze{color:#CD7F32}
.rank-name{flex:1;color:#fff;font-size:15px;font-weight:600}
.rank-score{color:#FFD93D;font-weight:800;font-size:18px}
.rank-time{color:rgba(255,255,255,.4);font-size:11px;margin-top:2px}
.empty-rank{color:rgba(255,255,255,.4);text-align:center;padding:40px 0;font-size:14px}

/* 昵称输入 */
.name-input-container{display:none;flex-direction:column;align-items:center;width:90%;max-width:340px}
.name-input-container .input-label{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:12px}
.name-input-container .input-hint{color:rgba(255,255,255,.5);font-size:12px;margin-top:8px;text-align:center}
#name-input{width:100%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:14px 18px;color:#fff;font-size:16px;outline:none;text-align:center}
#name-input::placeholder{color:rgba(255,255,255,.4)}
#name-input:focus{border-color:rgba(255,217,61,.5)}
.rank-badge{font-size:16px;font-weight:700;color:#FFD93D;margin-bottom:8px}

/* 邀请按钮 */
.invite-section{margin-top:12px;text-align:center}
.invite-share-text{display:none;color:rgba(255,255,255,.5);font-size:12px;margin-top:8px}
.invite-share-text.show{display:block}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:12px 28px;border-radius:24px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="game">
  <div class="deco deco1">🎯</div>
  <div class="deco deco2">⚡</div>

  <div id="title">
    <h1>Emoji大作战</h1>
    <p>30秒手速极限挑战</p>
  </div>

  <div id="info-bar">
    <div class="info-box">
      <div class="info-label">得分</div>
      <div class="info-value" id="score-value">0</div>
    </div>
    <div class="info-box">
      <div class="info-label">倒计时</div>
      <div class="info-value" id="timer-value">30</div>
    </div>
  </div>

  <div id="grid"></div>

  <!-- 开始界面 -->
  <div class="overlay" id="start-screen">
    <div style="font-size:64px;margin-bottom:12px">🚀</div>
    <h2>Emoji大作战</h2>
    <p class="subtitle">点击出现的Emoji得分，避开💣炸弹！</p>
    <div style="color:rgba(255,255,255,.5);font-size:13px;margin-bottom:24px;text-align:center;line-height:1.8">
      ⭐ 星星 +5分 &nbsp; 😎 表情 +2分<br>
      💣 炸弹 -3分 &nbsp; 🔥 火焰 +8分
    </div>
    <button class="btn" id="start-btn">开始挑战</button>
    <button class="btn btn-secondary" id="show-rank-btn" style="margin-top:12px">🏆 查看排行榜</button>
  </div>

  <!-- 结果界面 -->
  <div class="overlay hidden" id="result-screen">
    <div id="result">
      <div class="rating" id="rating-emoji">🏆</div>
      <div class="final-score" id="final-score">0</div>
      <div class="score-label">最终得分</div>
      <div class="best-score" id="best-score">历史最高: 0</div>
      <div class="comment" id="result-comment"></div>
      <button class="btn" id="restart-btn">再来一局</button>
      <div class="btn-row">
        <button class="btn btn-secondary" id="submit-score-btn">📤 提交排行榜</button>
        <button class="btn btn-secondary" id="invite-btn">📨 邀请好友</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="view-rank-btn">🏆 排行榜</button>
      </div>
    </div>
  </div>

  <!-- 昵称输入界面 -->
  <div class="overlay hidden" id="name-screen">
    <div class="name-input-container">
      <div style="font-size:48px;margin-bottom:12px">🏅</div>
      <h2>提交成绩</h2>
      <div class="rank-badge" id="rank-badge"></div>
      <div class="input-label">输入你的昵称</div>
      <input type="text" id="name-input" placeholder="输入昵称" maxlength="12" autocomplete="off">
      <div class="input-hint">最多12个字符</div>
      <div class="btn-row">
        <button class="btn" id="confirm-submit-btn">确认提交</button>
        <button class="btn btn-secondary" id="cancel-submit-btn">取消</button>
      </div>
    </div>
  </div>

  <!-- 排行榜界面 -->
  <div class="overlay hidden" id="rank-screen">
    <div style="font-size:48px;margin-bottom:8px">🏆</div>
    <h2>排行榜</h2>
    <p class="subtitle">Top 20 高分玩家</p>
    <div id="rank-list"></div>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn btn-secondary" id="back-from-rank-btn">返回</button>
      <button class="btn btn-secondary" id="invite-from-rank-btn">📨 邀请好友</button>
    </div>
  </div>

  <!-- 邀请界面 -->
  <div class="overlay hidden" id="invite-screen">
    <div style="font-size:48px;margin-bottom:12px">📨</div>
    <h2>邀请好友一起玩</h2>
    <p class="subtitle">快叫上朋友来比拼手速吧！</p>
    <div style="color:rgba(255,255,255,.5);font-size:13px;text-align:center;margin-bottom:20px;line-height:1.8">
      分享链接给好友，一起挑战排行榜！
    </div>
    <button class="btn" id="copy-link-btn">复制邀请链接</button>
    <button class="btn btn-secondary" id="share-btn" style="margin-top:12px">系统分享</button>
    <div class="invite-share-text" id="invite-text"></div>
    <div class="btn-row" style="margin-top:20px">
      <button class="btn btn-secondary" id="back-from-invite-btn">返回</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var EMOJIS = [
    {char:'😎',score:2,weight:30},
    {char:'😄',score:2,weight:30},
    {char:'🥳',score:3,weight:20},
    {char:'⭐',score:5,weight:15},
    {char:'🔥',score:8,weight:8},
    {char:'💣',score:-3,weight:12}
  ];

  var GAME_TIME = 30;
  var GRID_SIZE = 9;
  var SPAWN_INTERVAL = 700;
  var POP_DURATION = 1200;

  var grid = document.getElementById('grid');
  var cells = [];
  var scoreEl = document.getElementById('score-value');
  var timerEl = document.getElementById('timer-value');
  var startScreen = document.getElementById('start-screen');
  var resultScreen = document.getElementById('result-screen');
  var nameScreen = document.getElementById('name-screen');
  var rankScreen = document.getElementById('rank-screen');
  var inviteScreen = document.getElementById('invite-screen');
  var startBtn = document.getElementById('start-btn');
  var restartBtn = document.getElementById('restart-btn');
  var submitScoreBtn = document.getElementById('submit-score-btn');
  var inviteBtn = document.getElementById('invite-btn');
  var viewRankBtn = document.getElementById('view-rank-btn');
  var showRankBtn = document.getElementById('show-rank-btn');
  var confirmSubmitBtn = document.getElementById('confirm-submit-btn');
  var cancelSubmitBtn = document.getElementById('cancel-submit-btn');
  var copyLinkBtn = document.getElementById('copy-link-btn');
  var shareBtn = document.getElementById('share-btn');
  var backFromRankBtn = document.getElementById('back-from-rank-btn');
  var backFromInviteBtn = document.getElementById('back-from-invite-btn');
  var inviteFromRankBtn = document.getElementById('invite-from-rank-btn');
  var nameInput = document.getElementById('name-input');
  var toast = document.getElementById('toast');

  var score = 0;
  var timeLeft = GAME_TIME;
  var gameRunning = false;
  var activeCells = {};
  var spawnTimer = null;
  var countdownTimer = null;
  var popTimers = {};
  var lastScore = 0;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 2000);
  }

  function initGrid(){
    grid.innerHTML = '';
    cells = [];
    for (var i = 0; i < GRID_SIZE; i++){
      var cell = document.createElement('div');
      cell.className = 'cell';
      var emoji = document.createElement('span');
      emoji.className = 'emoji';
      cell.appendChild(emoji);
      (function(idx){
        cell.addEventListener('touchstart', function(e){
          e.preventDefault();
          hitCell(idx);
        }, {passive:false});
        cell.addEventListener('click', function(){
          hitCell(idx);
        });
      })(i);
      grid.appendChild(cell);
      cells.push(cell);
    }
  }

  function pickEmoji(){
    var totalWeight = 0;
    for (var i = 0; i < EMOJIS.length; i++) totalWeight += EMOJIS[i].weight;
    var r = Math.random() * totalWeight;
    for (var i = 0; i < EMOJIS.length; i++){
      r -= EMOJIS[i].weight;
      if (r <= 0) return EMOJIS[i];
    }
    return EMOJIS[0];
  }

  function spawnEmoji(){
    if (!gameRunning) return;
    var available = [];
    for (var i = 0; i < GRID_SIZE; i++){
      if (activeCells[i] == null) available.push(i);
    }
    if (available.length === 0) return;
    var idx = available[Math.floor(Math.random() * available.length)];
    var emojiData = pickEmoji();
    var cell = cells[idx];
    var emojiEl = cell.querySelector('.emoji');
    emojiEl.textContent = emojiData.char;
    cell.classList.add('active');
    cell.classList.remove('hit');
    activeCells[idx] = emojiData;
    popTimers[idx] = setTimeout(function(){
      if (activeCells[idx]){
        cell.classList.remove('active');
        delete activeCells[idx];
        delete popTimers[idx];
      }
    }, POP_DURATION);
  }

  function hitCell(idx){
    if (!gameRunning) return;
    var data = activeCells[idx];
    if (!data) return;
    var cell = cells[idx];
    cell.classList.add('hit');
    cell.classList.remove('active');
    delete activeCells[idx];
    if (popTimers[idx]){
      clearTimeout(popTimers[idx]);
      delete popTimers[idx];
    }
    score += data.score;
    if (score < 0) score = 0;
    scoreEl.textContent = score;
    scoreEl.style.transform = 'scale(1.3)';
    setTimeout(function(){ scoreEl.style.transform = 'scale(1)'; }, 200);
    var pop = document.createElement('div');
    pop.className = 'score-pop';
    pop.textContent = (data.score > 0 ? '+' : '') + data.score;
    pop.style.color = data.score > 0 ? '#FFD93D' : '#FF6B6B';
    pop.style.left = '50%';
    pop.style.top = '50%';
    cell.appendChild(pop);
    setTimeout(function(){ if (pop.parentNode) pop.parentNode.removeChild(pop); }, 600);
    if (data.score > 0){
      for (var p = 0; p < 4; p++){
        var particle = document.createElement('div');
        particle.className = 'particle';
        particle.textContent = '✨';
        particle.style.left = '50%';
        particle.style.top = '50%';
        var angle = (p / 4) * Math.PI * 2;
        var dist = 40 + Math.random() * 20;
        particle.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        particle.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        cell.appendChild(particle);
        (function(particle){
          setTimeout(function(){ if (particle.parentNode) particle.parentNode.removeChild(particle); }, 500);
        })(particle);
      }
    }
    setTimeout(function(){ cell.classList.remove('hit'); }, 200);
  }

  function startGame(){
    score = 0;
    timeLeft = GAME_TIME;
    scoreEl.textContent = '0';
    timerEl.textContent = GAME_TIME;
    timerEl.style.color = '#FF6B6B';
    gameRunning = true;
    activeCells = {};
    popTimers = {};
    for (var i = 0; i < GRID_SIZE; i++){
      cells[i].classList.remove('active', 'hit');
    }
    startScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    nameScreen.classList.add('hidden');
    rankScreen.classList.add('hidden');
    inviteScreen.classList.add('hidden');
    countdownTimer = setInterval(function(){
      timeLeft--;
      timerEl.textContent = timeLeft;
      if (timeLeft <= 5){
        timerEl.style.color = '#FF0000';
        timerEl.style.transform = 'scale(1.2)';
        setTimeout(function(){ timerEl.style.transform = 'scale(1)'; }, 200);
      }
      if (timeLeft <= 0){ endGame(); }
    }, 1000);
    function spawnLoop(){
      if (!gameRunning) return;
      spawnEmoji();
      var elapsed = GAME_TIME - timeLeft;
      var interval = Math.max(300, SPAWN_INTERVAL - elapsed * 15);
      spawnTimer = setTimeout(spawnLoop, interval);
    }
    spawnLoop();
  }

  function endGame(){
    gameRunning = false;
    clearInterval(countdownTimer);
    clearTimeout(spawnTimer);
    for (var i = 0; i < GRID_SIZE; i++){
      cells[i].classList.remove('active', 'hit');
      if (popTimers[i]) clearTimeout(popTimers[i]);
    }
    activeCells = {};
    popTimers = {};
    lastScore = score;
    var best = 0;
    try { best = parseInt(localStorage.getItem('emoji_battle_best') || '0'); } catch(e){}
    var isNewBest = score > best;
    if (isNewBest){
      best = score;
      try { localStorage.setItem('emoji_battle_best', String(best)); } catch(e){}
    }
    var rating, comment;
    if (score >= 80){ rating = '👑'; comment = '手速王者！你已经超越了99%的玩家！'; }
    else if (score >= 60){ rating = '🏆'; comment = '太厉害了！你的反应速度非常出色！'; }
    else if (score >= 40){ rating = '🥇'; comment = '不错的成绩！再练练就能进高手榜了！'; }
    else if (score >= 25){ rating = '🥈'; comment = '还不错的表现，继续加油！'; }
    else if (score >= 10){ rating = '🥉'; comment = '别灰心，多玩几次会越来越好的！'; }
    else { rating = '💪'; comment = '第一次玩吧？再来一次试试看！'; }

    document.getElementById('rating-emoji').textContent = rating;
    document.getElementById('final-score').textContent = score;
    document.getElementById('best-score').textContent = '历史最高: ' + best + (isNewBest ? ' 🎉新纪录！' : '');
    document.getElementById('result-comment').textContent = comment;
    resultScreen.classList.remove('hidden');
  }

  // 排行榜
  function loadRanklist(){
    var listEl = document.getElementById('rank-list');
    listEl.innerHTML = '<div class="empty-rank">加载中...</div>';
    fetch('/api/scores')
      .then(function(r){ return r.json(); })
      .then(function(scores){
        if (!scores || scores.length === 0){
          listEl.innerHTML = '<div class="empty-rank">还没有人上榜，快来成为第一名！🏆</div>';
          return;
        }
        var html = '';
        var savedName = '';
        try { savedName = localStorage.getItem('emoji_battle_name') || ''; } catch(e){}
        for (var i = 0; i < scores.length; i++){
          var s = scores[i];
          var posClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
          var meClass = (savedName && s.name === savedName) ? 'me' : '';
          var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1);
          html += '<div class="rank-item ' + meClass + '">'
            + '<div class="rank-pos ' + posClass + '">' + medal + '</div>'
            + '<div><div class="rank-name">' + escapeHtml(s.name) + '</div>'
            + '<div class="rank-time">' + (s.time || '') + '</div></div>'
            + '<div class="rank-score">' + s.score + '</div>'
            + '</div>';
        }
        listEl.innerHTML = html;
      })
      .catch(function(){
        listEl.innerHTML = '<div class="empty-rank">加载失败，请稍后重试</div>';
      });
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // 提交成绩
  function showSubmitName(){
    var badge = document.getElementById('rank-badge');
    badge.textContent = '本次得分: ' + lastScore + '分';
    var savedName = '';
    try { savedName = localStorage.getItem('emoji_battle_name') || ''; } catch(e){}
    nameInput.value = savedName;
    resultScreen.classList.add('hidden');
    nameScreen.classList.remove('hidden');
    setTimeout(function(){ nameInput.focus(); }, 300);
  }

  function submitScore(){
    var name = nameInput.value.trim();
    if (!name){
      showToast('请输入昵称');
      return;
    }
    try { localStorage.setItem('emoji_battle_name', name); } catch(e){}
    confirmSubmitBtn.textContent = '提交中...';
    confirmSubmitBtn.disabled = true;
    fetch('/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, score: lastScore })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      confirmSubmitBtn.textContent = '确认提交';
      confirmSubmitBtn.disabled = false;
      if (data.error){
        showToast('提交失败: ' + data.error);
        return;
      }
      showToast('提交成功！排名第' + data.rank + '名');
      nameScreen.classList.add('hidden');
      loadRanklist();
      rankScreen.classList.remove('hidden');
    })
    .catch(function(){
      confirmSubmitBtn.textContent = '确认提交';
      confirmSubmitBtn.disabled = false;
      showToast('网络错误，请稍后重试');
    });
  }

  // 邀请好友
  function getShareUrl(){
    var savedName = '';
    try { savedName = localStorage.getItem('emoji_battle_name') || ''; } catch(e){}
    var baseUrl = window.location.origin + window.location.pathname;
    if (savedName){
      return baseUrl + '?from=' + encodeURIComponent(savedName);
    }
    return baseUrl;
  }

  function getShareText(){
    var savedName = '';
    try { savedName = localStorage.getItem('emoji_battle_name') || ''; } catch(e){}
    if (savedName && lastScore > 0){
      return savedName + ' 邀请你来挑战Emoji大作战！我得了' + lastScore + '分，你能超过我吗？';
    }
    return '来玩Emoji大作战吧！30秒手速极限挑战，看看谁的反应更快！';
  }

  function copyInviteLink(){
    var url = getShareUrl();
    var text = getShareText() + ' ' + url;
    if (navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        showToast('邀请链接已复制，快去粘贴给好友吧！');
      }).catch(function(){
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showToast('邀请链接已复制，快去粘贴给好友吧！'); }
    catch(e){ showToast('复制失败，请手动复制链接'); }
    document.body.removeChild(ta);
  }

  function systemShare(){
    var url = getShareUrl();
    var text = getShareText();
    if (navigator.share){
      navigator.share({
        title: 'Emoji大作战',
        text: text,
        url: url
      }).then(function(){
        showToast('分享成功！');
      }).catch(function(e){
        if (e.name !== 'AbortError'){
          copyInviteLink();
        }
      });
    } else {
      copyInviteLink();
    }
  }

  // 页面切换
  function showOverlay(el){
    var overlays = [startScreen, resultScreen, nameScreen, rankScreen, inviteScreen];
    for (var i = 0; i < overlays.length; i++){
      overlays[i].classList.add('hidden');
    }
    el.classList.remove('hidden');
  }

  // 事件绑定
  startBtn.addEventListener('click', startGame);
  restartBtn.addEventListener('click', startGame);
  showRankBtn.addEventListener('click', function(){
    showOverlay(rankScreen);
    loadRanklist();
  });
  submitScoreBtn.addEventListener('click', showSubmitName);
  confirmSubmitBtn.addEventListener('click', submitScore);
  cancelSubmitBtn.addEventListener('click', function(){ showOverlay(resultScreen); });
  nameInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){ submitScore(); }
  });
  viewRankBtn.addEventListener('click', function(){
    showOverlay(rankScreen);
    loadRanklist();
  });
  backFromRankBtn.addEventListener('click', function(){
    if (lastScore > 0 || !resultScreen.classList.contains('hidden')){
      showOverlay(resultScreen);
    } else {
      showOverlay(startScreen);
    }
  });
  inviteFromRankBtn.addEventListener('click', function(){ showOverlay(inviteScreen); });
  inviteBtn.addEventListener('click', function(){ showOverlay(inviteScreen); });
  copyLinkBtn.addEventListener('click', copyInviteLink);
  shareBtn.addEventListener('click', systemShare);
  backFromInviteBtn.addEventListener('click', function(){
    if (!rankScreen.classList.contains('hidden')){
      showOverlay(rankScreen);
    } else if (lastScore > 0){
      showOverlay(resultScreen);
    } else {
      showOverlay(startScreen);
    }
  });

  // 检查是否通过邀请链接进入
  var params = new URLSearchParams(window.location.search);
  var fromUser = params.get('from');
  if (fromUser){
    setTimeout(function(){
      showToast(decodeURIComponent(fromUser) + ' 邀请你来挑战！');
    }, 500);
  }

  initGrid();

  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  document.addEventListener('dblclick', function(e){ e.preventDefault(); });
})();
</script>
</body>
</html>
